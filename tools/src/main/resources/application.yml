spring:
  application:
    name: white-eyes-tools
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # 스키마는 관리자 앱이 만든다
  flyway:
    enabled: false
  session:
    store-type: none
