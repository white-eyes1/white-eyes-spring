<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  두 앱이 함께 쓰는 화면 틀(공통 틀 #136, SCR-A-013·SCR-U-004, FNC-C-003 CSRF·FNC-C-025 범례).
  페이지 쓰는 법:
    <head> <th:block th:replace="~{fragments/layout :: head('제목')}"/> [<th:block th:replace="~{fragments/layout :: leaflet}"/>] </head>
    <body class="we"> <header th:replace="~{fragments/layout :: adminHeader('dashboard')}"></header> <main>…</main>
                      <th:block th:replace="~{fragments/layout :: scripts}"/> </body>
-->
<body>

<!-- 모든 화면의 <head> 공통 부분. title은 '제목 - White Eyes'로 붙는다 -->
<th:block th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="context-path" th:content="@{/}">
    <title th:text="|${title} - White Eyes|">White Eyes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
    <link rel="stylesheet" th:href="@{/css/we.css}">
</th:block>

<!-- 지도가 필요한 화면만 <head>에 더한다. Leaflet 코드는 js/map/ 안에서만 쓴다 -->
<th:block th:fragment="leaflet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
</th:block>

<!-- SCR-A-013 관리자 공통 헤더. active: dashboard | stats | events | manage -->
<header th:fragment="adminHeader(active)" class="we topbar" data-header="admin">
    <a class="brand" th:href="@{/stats}">White Eyes<small>관리자</small></a>
    <nav class="tabs" aria-label="주요 메뉴">
        <a class="tab" th:classappend="${active == 'dashboard'} ? 'on'" th:href="@{/stats}">대시보드</a>
        <a class="tab" th:classappend="${active == 'stats'} ? 'on'" th:href="@{/stats/graph}">통계</a>
        <div class="tab-group">
            <a class="tab" th:classappend="${active == 'events'} ? 'on'" th:href="@{/events}">이벤트 로그</a>
            <!-- 미확인 이벤트 배지(FNC-A-048). 탭은 필터 없이 SCR-A-010으로, 배지만 미확인 필터로 간다. 숫자는 알림 스트림이 채우고, 0이면 숨긴다 -->
            <a class="badge-count" th:href="@{/events(status='UNCHECKED')}" id="unchecked-badge" hidden></a>
        </div>
        <div class="menu-wrap" data-menu>
            <button type="button" class="tab" th:classappend="${active == 'manage'} ? 'on'"
                    aria-haspopup="true" aria-expanded="false" data-menu-toggle>관리
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <div class="menu-list" hidden data-menu-list>
                <a th:href="@{/zones}">구역 관리</a>
                <a th:href="@{/cameras}">캠 관리</a>
                <a th:href="@{/users}">사용자 관리</a>
                <a th:if="${superAdmin}" th:href="@{/admins}">관리자 관리</a>
                <a th:if="${superAdmin}" th:href="@{/histories}">작업 기록</a>
            </div>
        </div>
    </nav>
    <div class="head-right">
        <div class="legend" id="level-legend" aria-label="혼잡 단계 범례"></div>
        <div class="usermenu-wrap" data-menu>
            <button type="button" class="usermenu" aria-haspopup="true" aria-expanded="false" data-menu-toggle>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
                <span th:text="${currentLoginId}">admin</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <div class="menu-list right" hidden data-menu-list>
                <a th:href="@{/me}">내 정보</a>
                <form th:action="@{/logout}" method="post"><button type="submit">로그아웃</button></form>
            </div>
        </div>
    </div>
</header>

<!-- SCR-A-008 실시간 보기 창(관리자 앱). 대시보드 지도 핀·캠 카드와 캠 관리의 '실시간 보기'에서 연다. 동작은 js/live/live-view.js -->
<div th:fragment="adminLiveModal" class="modal-stage live-modal-stage" id="live-modal" hidden>
    <div class="modal live-modal" role="dialog" aria-modal="true" aria-label="실시간 보기">
        <div class="modal-head">
            <div>
                <p class="eyebrow">LIVE VIEW · <span id="live-cam"></span></p>
                <h2><span id="live-name"></span> <span class="muted live-place" id="live-place"></span></h2>
            </div>
            <button class="icon-btn" type="button" aria-label="닫기" data-live-close>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>
        <div class="live-body">
            <div class="live-feed">
                <img id="live-img" alt="실시간 영상" hidden>
                <div class="live-notice" id="live-notice" role="status" hidden>
                    <span id="live-notice-text"></span>
                    <button type="button" class="btn secondary sm" id="live-retry" hidden>다시 시도</button>
                </div>
                <span class="live-badge"><i class="rec"></i>LIVE · MJPEG</span>
                <span class="live-count-badge" id="live-count-badge"></span>
            </div>
        </div>
        <div class="live-foot">
            <div><span class="muted">현재 인원</span><div class="value" id="live-count">-</div></div>
            <div><span class="muted">밀집도</span><div class="value"><span id="live-density">-</span> <small class="muted">명/㎡</small></div></div>
            <span class="chip" id="live-level" hidden></span>
            <button type="button" class="btn secondary live-playback" id="live-playback">다시보기</button>
        </div>
    </div>
</div>

<!--
  SCR-C-006 엑셀 다운로드 창(FNC-C-023, 두 앱). 통계 메인 통계 패널과 통계 그래프의 '엑셀 다운로드'에서 연다.
  <head>에 css/stats-export.css를 더한다. 동작은 js/export/export-modal.js
-->
<div th:fragment="statExportModal" class="modal-stage export-modal-stage" id="export-modal" hidden>
    <form class="modal export-modal" role="dialog" aria-modal="true" aria-labelledby="export-title" novalidate>
        <div class="modal-head">
            <h2 id="export-title">엑셀 다운로드</h2>
            <button class="icon-btn" type="button" aria-label="닫기" data-export-close>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>
        <div class="modal-body">
            <label class="field">범위
                <select class="input" id="export-scope"></select>
            </label>
            <div class="export-expand" id="export-expand-row" hidden>
                <label class="ck"><input type="checkbox" id="export-expand"><i></i>구역별 펼치기</label>
                <span class="export-expand-hint">체크하지 않으면 지역 합산 한 줄로 받습니다</span>
            </div>
            <div class="export-period">
                <label class="field export-period-range">기간
                    <span class="export-period-inputs">
                        <input class="input" type="datetime-local" id="export-from" aria-label="시작 시각">
                        <span class="muted">~</span>
                        <input class="input" type="datetime-local" id="export-end" aria-label="끝 시각">
                    </span>
                </label>
                <label class="field export-interval">단위
                    <select class="input" id="export-interval">
                        <option value="1m">1분</option>
                        <option value="1h">1시간</option>
                        <option value="1d">1일</option>
                        <option value="1w">1주</option>
                        <option value="1M">1월</option>
                        <option value="1y">1년</option>
                    </select>
                </label>
            </div>
            <div class="field">항목
                <div class="export-items" id="export-items">
                    <label class="ck"><input type="checkbox" value="COUNT" checked><i></i>인원</label>
                    <label class="ck"><input type="checkbox" value="DENSITY" checked><i></i>밀집도</label>
                    <label class="ck"><input type="checkbox" value="INFLOW" checked><i></i>유입</label>
                    <label class="ck"><input type="checkbox" value="OUTFLOW" checked><i></i>유출</label>
                    <label class="ck"><input type="checkbox" value="DWELL"><i></i>평균 체류</label>
                </div>
            </div>
            <p class="hint err export-reason" id="export-reason" role="status" hidden></p>
            <p class="alert" id="export-error" role="alert" hidden></p>
        </div>
        <div class="modal-foot">
            <button class="btn secondary" type="button" data-export-close>취소</button>
            <button class="btn primary" type="submit" id="export-submit">다운로드</button>
        </div>
    </form>
</div>

<!-- SCR-U-004 사용자 공통 헤더(틀만). active: dashboard | stats -->
<header th:fragment="userHeader(active)" class="we topbar" data-header="user">
    <a class="brand" th:href="@{/stats}">White Eyes<small>혼잡 현황</small></a>
    <nav class="tabs" aria-label="주요 메뉴">
        <a class="tab" th:classappend="${active == 'dashboard'} ? 'on'" th:href="@{/stats}">대시보드</a>
        <a class="tab" th:classappend="${active == 'stats'} ? 'on'" th:href="@{/stats/graph}">통계</a>
    </nav>
    <div class="head-right">
        <div class="legend" id="level-legend" aria-label="혼잡 단계 범례"></div>
        <div class="usermenu-wrap" data-menu>
            <button type="button" class="usermenu" aria-haspopup="true" aria-expanded="false" data-menu-toggle>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
                <span th:text="${currentLoginId}">user01</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <div class="menu-list right" hidden data-menu-list>
                <a th:href="@{/me}">내 정보</a>
                <form th:action="@{/logout}" method="post"><button type="submit">로그아웃</button></form>
            </div>
        </div>
    </div>
</header>

<!-- 화면 맨 아래에 둔다. 헤더 동작(범례·메뉴)을 붙인다 -->
<th:block th:fragment="scripts">
    <script type="module" th:src="@{/js/common/header.js}"></script>
</th:block>

</body>
</html>
