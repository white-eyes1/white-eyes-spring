<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  두 앱이 함께 쓰는 화면 틀(공통 틀 #136, SCR-A-013·SCR-U-004, FNC-C-003 CSRF·FNC-C-025 범례).
  페이지 쓰는 법:
    <head> <th:block th:replace="~{fragments/layout :: head('제목')}"/> [<th:block th:replace="~{fragments/layout :: leaflet}"/>] </head>
    <body class="we"> <header th:replace="~{fragments/layout :: adminHeader('dashboard')}"></header> <main>…</main>
                      <th:block th:replace="~{fragments/layout :: scripts}"/> </body>
-->
<body>

<!-- 모든 화면의 <head> 공통 부분. title은 '제목 - White Eyes'로 붙는다 -->
<th:block th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="context-path" th:content="@{/}">
    <title th:text="|${title} - White Eyes|">White Eyes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
    <link rel="stylesheet" th:href="@{/css/we.css}">
</th:block>

<!-- 지도가 필요한 화면만 <head>에 더한다. Leaflet 코드는 js/map/ 안에서만 쓴다 -->
<th:block th:fragment="leaflet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
</th:block>

<!-- SCR-A-013 관리자 공통 헤더. active: dashboard | stats | events | manage -->
<header th:fragment="adminHeader(active)" class="we topbar" data-header="admin">
    <a class="brand" th:href="@{/stats}">White Eyes<small>관리자</small></a>
    <nav class="tabs" aria-label="주요 메뉴">
        <a class="tab" th:classappend="${active == 'dashboard'} ? 'on'" th:href="@{/stats}">대시보드</a>
        <a class="tab" th:classappend="${active == 'stats'} ? 'on'" th:href="@{/stats/compare}">통계·기간 비교</a>
        <a class="tab" th:classappend="${active == 'events'} ? 'on'" th:href="@{/events}">이벤트 로그
            <!-- 미확인 이벤트 배지 자리(FNC-A-048, 2단계). 지금은 숨김 -->
            <span class="badge-count" id="unchecked-badge" hidden></span></a>
        <div class="menu-wrap" data-menu>
            <button type="button" class="tab" th:classappend="${active == 'manage'} ? 'on'"
                    aria-haspopup="true" aria-expanded="false" data-menu-toggle>관리
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <div class="menu-list" hidden data-menu-list>
                <a th:href="@{/zones}">구역 관리</a>
                <a th:href="@{/cameras}">캠 관리</a>
                <a th:href="@{/users}">사용자 관리</a>
                <a th:if="${superAdmin}" th:href="@{/admins}">관리자 관리</a>
                <a th:if="${superAdmin}" th:href="@{/histories}">작업 기록</a>
            </div>
        </div>
    </nav>
    <div class="head-right">
        <div class="legend" id="level-legend" aria-label="혼잡 단계 범례"></div>
        <div class="usermenu-wrap" data-menu>
            <button type="button" class="usermenu" aria-haspopup="true" aria-expanded="false" data-menu-toggle>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
                <span th:text="${currentLoginId}">admin</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <div class="menu-list right" hidden data-menu-list>
                <a th:href="@{/me}">내 정보</a>
                <form th:action="@{/logout}" method="post"><button type="submit">로그아웃</button></form>
            </div>
        </div>
    </div>
</header>

<!-- SCR-U-004 사용자 공통 헤더(틀만). active: dashboard | stats -->
<header th:fragment="userHeader(active)" class="we topbar" data-header="user">
    <a class="brand" th:href="@{/stats}">White Eyes<small>혼잡 현황</small></a>
    <nav class="tabs" aria-label="주요 메뉴">
        <a class="tab" th:classappend="${active == 'dashboard'} ? 'on'" th:href="@{/stats}">대시보드</a>
        <a class="tab" th:classappend="${active == 'stats'} ? 'on'" th:href="@{/stats/compare}">통계·기간 비교</a>
    </nav>
    <div class="head-right">
        <div class="legend" id="level-legend" aria-label="혼잡 단계 범례"></div>
        <div class="usermenu-wrap" data-menu>
            <button type="button" class="usermenu" aria-haspopup="true" aria-expanded="false" data-menu-toggle>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
                <span th:text="${currentLoginId}">user01</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <div class="menu-list right" hidden data-menu-list>
                <a th:href="@{/me}">내 정보</a>
                <form th:action="@{/logout}" method="post"><button type="submit">로그아웃</button></form>
            </div>
        </div>
    </div>
</header>

<!-- 화면 맨 아래에 둔다. 헤더 동작(범례·메뉴)을 붙인다 -->
<th:block th:fragment="scripts">
    <script type="module" th:src="@{/js/common/header.js}"></script>
</th:block>

</body>
</html>
