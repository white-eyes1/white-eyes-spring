<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  통계 그래프 SCR-C-004(FNC-C-012), 두 앱이 함께 쓰는 화면. 대상·단위·기간은 주소 쿼리로 유지한다.
  엑셀 다운로드(SCR-C-006, FNC-C-023)는 현재 대상·단위·기간을 넘겨 창을 연다.
  하위 비교(FNC-C-014)는 그래프 패널 머리의 토글로 켠다(대상이 지역일 때만).
  단계별 들어가기(FNC-C-013): 점을 누르면 한 단계 아래 단위로 다시 그리고, 패널 머리 왼쪽에 이동 경로를 남긴다.
  1시간 점은 관리자 앱에서 '1분 단위로 보기'·'다시보기' 작은 메뉴를 띄운다(stats-graph/drill.js, stats-graph.js).
  시연용 데이터 표시(FNC-C-024): 시연용 점의 칸은 옅은 배경, 하나라도 있으면 제목 옆 '시연용 데이터 포함' 배지.
  그래프는 세로 4칸(결정 0016): 통합 → 시간별 인원·혼잡 단계 → 인원·유입·유출 → 방향별 흐름. 네 칸이 같은 응답·같은 구간을 쓰고,
  하위 비교를 켜면 아래 세 칸은 숨긴다.
  기간 비교 화면(SCR-C-005)은 결정 0016으로 없앴다.
-->
<head>
    <th:block th:replace="~{fragments/layout :: head('통계 그래프')}"/>
    <!-- 그래프가 필요한 화면만 Chart.js를 더한다. Chart.js 코드는 js/chart/ 안에서만 쓴다 -->
    <script src="https://unpkg.com/chart.js@4.4.7/dist/chart.umd.js"></script>
    <link rel="stylesheet" th:href="@{/css/stats-graph.css}">
    <link rel="stylesheet" th:href="@{/css/stats-export.css}">
</head>
<body class="we">
<header th:replace="${admin} ? ~{fragments/layout :: adminHeader('stats')} : ~{fragments/layout :: userHeader('stats')}"></header>
<main class="page">
    <div class="page-heading">
        <div><p class="eyebrow">STATISTICS</p><h1>통계 그래프 <span class="chip demo" id="demo-badge" hidden>시연용 데이터 포함</span></h1></div>
        <button type="button" class="btn secondary" id="export-open">엑셀 다운로드</button>
    </div>

    <section class="panel graph-conditions" aria-label="조회 조건">
        <div class="graph-target">
            <select class="input" id="target-sido" aria-label="시·도"></select>
            <select class="input" id="target-sigungu" aria-label="시·군·구"></select>
            <select class="input" id="target-emd" aria-label="읍·면·동"></select>
            <select class="input" id="target-zone" aria-label="구역"></select>
        </div>
        <div class="seg" role="tablist" aria-label="단위" id="interval-tabs">
            <button type="button" role="tab" data-interval="1m">1분</button>
            <button type="button" role="tab" data-interval="1h">1시간</button>
            <button type="button" role="tab" data-interval="1d">1일</button>
            <button type="button" role="tab" data-interval="1w">1주</button>
            <button type="button" role="tab" data-interval="1M">1월</button>
            <button type="button" role="tab" data-interval="1y">1년</button>
        </div>
        <div class="graph-period">
            <input class="input" type="datetime-local" id="period-from" aria-label="시작 시각">
            <span class="muted">~</span>
            <input class="input" type="datetime-local" id="period-end" aria-label="끝 시각">
            <button type="button" class="btn primary sm" id="period-apply">조회</button>
        </div>
        <div class="graph-items" id="graph-items" aria-label="항목">
            <label class="ck"><input type="checkbox" value="count" checked><i></i>인원</label>
            <label class="ck"><input type="checkbox" value="density" checked><i></i>밀집도</label>
            <label class="ck"><input type="checkbox" value="inflow"><i></i>유입</label>
            <label class="ck"><input type="checkbox" value="outflow"><i></i>유출</label>
            <label class="ck"><input type="checkbox" value="dwellAvgSec"><i></i>평균 체류</label>
        </div>
        <!-- 통합 그래프의 인원 평균 선에 최대~최소 띠를 함께 그린다(기본 끔) -->
        <label class="switch">최대·최소 띠
            <input type="checkbox" role="switch" id="band-toggle"><span aria-hidden="true"></span>
        </label>
    </section>

    <section class="panel graph-panel" aria-label="통계 그래프">
        <div class="panel-head graph-panel-head">
            <!-- 이동 경로(FNC-C-013): 들어간 단계(연>월>일>시). 누르면 그 단계로 돌아간다. 들어가기 전에는 비어 있다 -->
            <nav class="drill-path" id="drill-path" aria-label="이동 경로"></nav>
            <!-- 하위 비교(FNC-C-014): 대상이 지역일 때만 켤 수 있다. 켜면 고른 항목 하나를 하위 단위별 선으로 겹쳐 그린다 -->
            <div class="compare-controls">
                <select class="input" id="compare-item" aria-label="하위 비교 항목" hidden>
                    <option value="COUNT">인원</option>
                    <option value="DENSITY">밀집도</option>
                    <option value="INFLOW">유입</option>
                    <option value="OUTFLOW">유출</option>
                    <option value="DWELL">평균 체류</option>
                </select>
                <label class="switch">하위 비교
                    <input type="checkbox" role="switch" id="compare-toggle"><span aria-hidden="true"></span>
                </label>
            </div>
        </div>
        <p class="alert graph-error" id="graph-error" role="alert" hidden></p>
        <div class="graph-canvas">
            <canvas id="series-chart" role="img" aria-label="통계 그래프"></canvas>
            <p class="muted graph-empty" id="graph-empty" hidden>데이터 없음</p>
            <!-- 1시간 점 선택 창(FNC-C-013): 누른 점 옆에 띄운다. 버튼은 화면 JS가 앱에 맞게 채운다 -->
            <div class="point-menu" id="point-menu" role="dialog" aria-label="점 선택" hidden>
                <b id="point-menu-title"></b>
                <div class="muted" id="point-menu-summary"></div>
                <div class="point-menu-actions" id="point-menu-actions"></div>
                <div class="muted" id="point-menu-notice" hidden></div>
            </div>
        </div>
        <p class="muted compare-omitted" id="compare-omitted" hidden></p>
    </section>

    <div class="graph-panels" id="graph-panels">
        <section class="panel graph-sub" aria-label="시간별 인원 · 혼잡 단계">
            <div class="panel-head graph-sub-head">
                <h2>시간별 인원 · 혼잡 단계</h2>
                <span class="graph-legend"><i class="l1"></i>정상<i class="l2"></i>주의<i class="l3"></i>위험</span>
            </div>
            <div class="graph-sub-canvas"><canvas id="level-chart" role="img" aria-label="시간별 인원 막대, 혼잡 단계 색"></canvas></div>
        </section>
        <section class="panel graph-sub" aria-label="인원 · 유입·유출">
            <div class="panel-head graph-sub-head">
                <h2>인원 · 유입·유출</h2>
                <span class="graph-legend"><i class="in"></i>유입<i class="out"></i>유출<i class="congested"></i>주의 이상</span>
            </div>
            <p class="graph-sub-label">인원</p>
            <div class="graph-sub-canvas count"><canvas id="count-chart" role="img" aria-label="시간별 인원 선"></canvas></div>
            <p class="graph-sub-label">유입(위) · 유출(아래)</p>
            <div class="graph-sub-canvas flow"><canvas id="flow-chart" role="img" aria-label="시간별 유입·유출 막대"></canvas></div>
        </section>
        <section class="panel graph-sub" aria-label="방향별 흐름">
            <div class="panel-head graph-sub-head">
                <h2>방향별 흐름 <span class="muted">선택한 기간 합계</span></h2>
                <span class="graph-legend"><i class="in"></i>유입<i class="out"></i>유출</span>
            </div>
            <div class="graph-sub-canvas direction">
                <canvas id="direction-chart" role="img" aria-label="방향별 유입·유출 가로 막대"></canvas>
                <p class="muted graph-empty" id="direction-empty" hidden>데이터 없음</p>
            </div>
        </section>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: statExportModal}"/>
<th:block th:replace="~{fragments/layout :: scripts}"/>
<script type="module" th:src="@{/js/pages/stats-graph.js}"></script>
</body>
</html>
