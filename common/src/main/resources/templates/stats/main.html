<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  통계 메인(대시보드) SCR-C-003, 두 앱이 함께 쓰는 화면(FNC-C-008·009·016·025, 캠 패널 FNC-A-022).
  admin 모델 값이 true일 때만 지역 등록·수정 버튼과 캠 패널이 그려진다(관리자 앱).
  새 1분 통계는 통계 SSE(FNC-C-022)로 받아 화면을 새로 읽는다.
  비정상 인원 변동(FNC-C-020)은 펼칠 때 기간 비교 API로 읽는다.
  다른 2·3단계 접기 영역(시간대별 단계, 방문 패턴, 피크·증감, 보조 지표)과 엑셀 버튼은 아직 없다.
-->
<head>
    <th:block th:replace="~{fragments/layout :: head('대시보드')}"/>
    <th:block th:replace="~{fragments/layout :: leaflet}"/>
    <link rel="stylesheet" th:href="@{/css/stats-main.css}">
    <link rel="stylesheet" th:href="@{/css/live.css}">
</head>
<body class="we">
<div class="dash" id="dash" th:attr="data-admin=${admin}, data-snapshot-interval-sec=${cardSnapshotIntervalSec}">
    <header th:replace="${admin} ? ~{fragments/layout :: adminHeader('dashboard')} : ~{fragments/layout :: userHeader('dashboard')}"></header>

    <div class="filterbar">
        <span class="filter-title">지역 필터</span>
        <select class="input filter-select" id="filter-sido" aria-label="시·도"></select>
        <select class="input filter-select" id="filter-sigungu" aria-label="시·군·구"></select>
        <select class="input filter-select" id="filter-emd" aria-label="읍·면·동"></select>
        <!-- 실시간 통계 갱신(FNC-C-022) 연결이 끊기면 보인다. 브라우저가 5초 뒤 자동으로 다시 연결한다 -->
        <span class="stream-status" id="stream-status" role="status" hidden>
            <i class="dot off"></i>연결 끊김 · 다시 연결하는 중
        </span>
        <a class="btn secondary" th:if="${admin}" th:href="@{/zones}" style="margin-left: auto">지역 등록·수정</a>
    </div>

    <div class="dash-body" id="dash-body">
        <aside class="stat-panel" id="stat-panel">
            <div class="stat-head">
                <span><b>통계</b> <span class="target" id="stat-target"></span></span>
                <button type="button" class="icon-btn" id="panel-collapse" aria-label="통계 패널 접기">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg>
                </button>
            </div>
            <div class="stat-body">
                <section class="acc zone-box">
                    <div class="row-between"><strong>구역별 현재 인원</strong><span class="muted small" id="zone-time"></span></div>
                    <div class="tabrow" role="tablist">
                        <button type="button" class="btn primary sm" data-zone-tab="count">현재 인원</button>
                        <button type="button" class="btn secondary sm" data-zone-tab="event">이벤트</button>
                        <button type="button" class="btn secondary sm" data-zone-tab="level">혼잡 단계</button>
                    </div>
                    <div class="donut-row">
                        <div class="donut" id="zone-donut"><div class="donut-hole"><small class="muted">합계</small><div id="zone-total">-</div></div></div>
                        <div class="zone-list" id="zone-list"></div>
                    </div>
                </section>
                <section class="acc">
                    <div class="acc-h">요약<span class="muted small" id="summary-time"></span></div>
                    <div class="cells">
                        <div class="cell"><strong id="sum-count">-</strong><span>현재 인원</span></div>
                        <div class="cell"><strong id="sum-density">-</strong><span>밀집도 명/㎡</span></div>
                        <div class="cell"><strong id="sum-level">-</strong><span>혼잡 단계</span></div>
                        <div class="cell"><strong id="sum-cameras">-</strong><span>가동 / 캠</span></div>
                        <div class="cell"><strong id="sum-events">-</strong><span>오늘 이벤트</span></div>
                        <div class="cell"><strong id="sum-max">-</strong><span>오늘 최대</span></div>
                    </div>
                </section>
                <section class="acc">
                    <div class="acc-h">유입·유출 (추정)<span class="muted small">최근 1분</span></div>
                    <div class="cells flow">
                        <div class="cell"><strong class="in" id="flow-in">-</strong><span>유입</span></div>
                        <div class="cell"><strong class="out" id="flow-out">-</strong><span>유출</span></div>
                        <div class="cell"><strong id="flow-dir">-</strong><span>주요 방향</span></div>
                    </div>
                </section>
                <section class="acc">
                    <div class="acc-h">혼잡 기준<span class="muted small" id="level-rule"></span></div>
                    <ul class="level-rules" id="level-rules"></ul>
                </section>
                <!-- 비정상 인원 변동(FNC-C-020): 펼칠 때 최근 7일을 지난달 같은 요일과 비교해 읽는다 -->
                <details class="acc fold" id="abnormal-box">
                    <summary class="acc-h">비정상 인원 변동<span class="muted small">최근 7일 · 지난달 대비</span></summary>
                    <div class="acc-b">
                        <div class="muted" id="abnormal-count"></div>
                        <div class="abnormal-list" id="abnormal-list"></div>
                        <a class="btn secondary sm" id="abnormal-detail" th:href="@{/stats/compare}">자세히</a>
                    </div>
                </details>
                <!-- 그래프 보기(FNC-C-012): 현재 지역을 넘긴다(panel.js renderGraphLink) -->
                <a class="btn secondary" id="graph-link" th:href="@{/stats/graph}">그래프 보기</a>
            </div>
        </aside>

        <section class="map dash-map" aria-label="지도">
            <div class="map-canvas" id="dash-map"></div>
            <button type="button" class="btn secondary sm panel-open" id="panel-open" hidden>통계</button>
            <div class="map-legend legend" id="map-legend"></div>
        </section>
    </div>

    <section class="deck" id="deck" th:if="${admin}">
        <div class="deck-grip" id="deck-grip" role="separator" tabindex="0"
             aria-label="캠 패널 높이 조절(끌어서 조절, 두 번 눌러 전환)"><span></span></div>
        <div class="deck-head">
            <span class="muted">지도 화면 안 캠 <b id="deck-count">0</b> 대</span>
            <div class="deck-tools">
                <select class="input deck-sort" id="deck-sort" aria-label="정렬">
                    <option value="density">혼잡도 높은 순</option>
                    <option value="name">이름순</option>
                </select>
                <button type="button" class="btn secondary sm" id="deck-toggle">전체 펼치기</button>
                <a class="btn secondary sm" th:href="@{/cameras}">캠 관리</a>
            </div>
        </div>
        <div class="deck-cards" id="deck-cards"></div>
    </section>
</div>
<!-- SCR-A-008 실시간 보기 창(관리자 앱만) -->
<th:block th:if="${admin}">
    <th:block th:replace="~{fragments/layout :: adminLiveModal}"/>
</th:block>

<th:block th:replace="~{fragments/layout :: scripts}"/>
<script type="module" th:src="@{/js/pages/stats-main.js}"></script>
</body>
</html>
