<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  기간 비교 분석 SCR-C-005(FNC-C-020), 두 앱이 함께 쓰는 화면.
  대상·대상 기간·기준 기간·비정상 기준은 주소 쿼리(targetType·targetId·from·to·basePreset 또는 baseFrom·baseTo·thresholdPct)로
  유지하고, 대시보드에서 올 때도 이 쿼리로 자동 입력된다.
-->
<head>
    <th:block th:replace="~{fragments/layout :: head('기간 비교 분석')}"/>
    <link rel="stylesheet" th:href="@{/css/stats-compare.css}">
</head>
<body class="we">
<header th:replace="${admin} ? ~{fragments/layout :: adminHeader('stats')} : ~{fragments/layout :: userHeader('stats')}"></header>
<main class="page">
    <div class="page-heading">
        <div><p class="eyebrow">PERIOD COMPARISON</p><h1>기간 비교 분석</h1><p>대상 기간의 요일×시간 평균 인원을 기준 기간과 비교합니다.</p></div>
        <a class="btn secondary" th:href="@{/stats/graph}">통계 그래프</a>
    </div>

    <section class="panel compare-conditions" aria-label="비교 조건">
        <div class="field">대상
            <div class="compare-target">
                <select class="input" id="target-sido" aria-label="시·도"></select>
                <select class="input" id="target-sigungu" aria-label="시·군·구"></select>
                <select class="input" id="target-emd" aria-label="읍·면·동"></select>
                <select class="input" id="target-zone" aria-label="구역"></select>
            </div>
        </div>
        <div class="field">대상 기간
            <div class="compare-dates">
                <input class="input" type="date" id="target-from" aria-label="대상 기간 시작">
                <span class="muted">~</span>
                <input class="input" type="date" id="target-to" aria-label="대상 기간 끝">
            </div>
        </div>
        <div class="field">기준 기간
            <div class="compare-dates">
                <select class="input" id="base-preset" aria-label="기준 기간">
                    <option value="LAST_MONTH">지난달 같은 요일</option>
                    <option value="LAST_YEAR">지난해 같은 기간</option>
                    <option value="CUSTOM">직접 지정</option>
                </select>
                <span class="compare-dates" id="base-dates" hidden>
                    <input class="input" type="date" id="base-from" aria-label="기준 기간 시작">
                    <span class="muted">~</span>
                    <input class="input" type="date" id="base-to" aria-label="기준 기간 끝">
                </span>
            </div>
        </div>
        <div class="field">비정상 기준
            <div class="compare-threshold">
                <span>±</span>
                <input class="input" type="number" id="threshold" min="5" max="100" step="1" value="30"
                       aria-label="비정상 기준 %" aria-describedby="threshold-hint">
                <span>%</span>
            </div>
        </div>
        <p class="hint err compare-hint" id="threshold-hint" hidden>5~100 사이로 입력해 주세요.</p>
        <p class="alert compare-error" id="compare-error" role="alert" hidden></p>
    </section>

    <div class="compare-body">
        <section class="panel compare-total" aria-label="전체 증감률">
            <span class="muted">전체 증감률</span>
            <strong id="total-rate">-</strong>
            <span class="muted" id="total-note"></span>
        </section>
        <section class="panel compare-table-panel" aria-label="요일×시간 비교표">
            <div class="compare-grid" id="compare-grid" role="table" aria-label="요일×시간 증감률"></div>
            <div class="compare-legend muted">
                <span><i class="dot up"></i> 비정상 증가(테두리)</span>
                <span><i class="dot down"></i> 비정상 감소(테두리)</span>
                <span><i class="dot off"></i> 비교 불가(기준 없음)</span>
                <span>칸에 마우스: 대상·기준 평균</span>
            </div>
        </section>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"/>
<script type="module" th:src="@{/js/pages/stats-compare.js}"></script>
</body>
</html>
