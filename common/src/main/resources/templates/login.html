<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('로그인')}"/>
</head>
<body class="we">
<!-- SCR-C-001: 두 앱이 같은 템플릿을 쓰고 앱 이름만 다르게 보인다 -->
<div style="min-height: 100vh; display: flex; flex-wrap: wrap">
    <section style="flex: 1 1 520px; padding: 64px; display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid var(--line); background: #0c121a">
        <p class="brand" style="font-size: 18px">White Eyes</p>
        <div style="display: flex; flex-direction: column; gap: 16px; max-width: 460px">
            <p class="eyebrow">DRONE CROWD MONITORING</p>
            <h1 style="font-size: 34px; font-weight: 700; line-height: 1.3">드론 영상으로 보는<br>구역별 혼잡 현황</h1>
            <p class="muted" style="font-size: 14px">구역마다 1분 단위 인원·밀집도를 모아 정상·주의·위험 단계로 보여 줍니다.</p>
            <div class="legend" style="margin-top: 8px"><span><i class="dot l1"></i>정상</span><span><i class="dot l2"></i>주의</span><span><i class="dot l3"></i>위험</span></div>
        </div>
        <p class="muted" style="font-size: 11px">© White Eyes 팀</p>
    </section>
    <section style="flex: 1 1 520px; display: grid; place-items: center; padding: 48px">
        <form class="panel" th:action="@{/login}" method="post" style="width: 100%; max-width: 400px; padding: 32px; display: flex; flex-direction: column; gap: 18px">
            <h2 style="font-size: 22px" th:text="|${appName} 로그인|">white-eyes 로그인</h2>
            <p class="alert" th:if="${errorMessage != null}" th:text="${errorMessage}" role="alert">오류 문구</p>
            <label class="field">아이디
                <input class="input" type="text" name="username" maxlength="20" required autofocus th:value="${loginId}">
            </label>
            <label class="field">비밀번호
                <input class="input" type="password" name="password" required>
            </label>
            <button class="btn primary lg" type="submit" style="width: 100%">로그인</button>
        </form>
    </section>
</div>
</body>
</html>
