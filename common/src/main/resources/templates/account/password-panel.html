<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  비밀번호 변경 패널(SCR-C-002 비밀번호 변경 영역, FNC-C-007). 비밀번호 변경 화면(password.html)과
  내 정보 화면(me.html, FNC-C-006)이 같은 패널을 쓴다. 동작은 js/pages/password-change.js.
  forced가 true면 강제 변경 안내 문구를 보인다.
-->
<body>
<form th:fragment="passwordPanel" class="panel" id="password-form" novalidate
      style="width: 100%; max-width: 480px; overflow: hidden">
    <div class="panel-head">
        <div><p class="eyebrow">MY ACCOUNT</p><h2 style="margin-top: 4px">비밀번호 변경</h2></div>
    </div>
    <div style="padding: 22px; display: flex; flex-direction: column; gap: 16px">
        <p th:if="${forced}" id="forced-notice"
           style="padding: 12px 14px; border: 1px solid #6b5520; border-radius: 8px; background: #241d0f; color: #ffd27a; font-size: 12px">임시 비밀번호로 로그인했습니다. 새 비밀번호를 설정하세요.</p>
        <label class="field">현재 비밀번호
            <input class="input" type="password" name="currentPassword" autocomplete="current-password" required>
            <span class="hint" data-hint-for="currentPassword" hidden></span>
        </label>
        <label class="field">새 비밀번호
            <input class="input" type="password" name="newPassword" autocomplete="new-password" required>
            <span class="hint" data-hint-for="newPassword">8~64자, 영문·숫자를 각각 1자 이상(특수문자 가능)</span>
        </label>
        <label class="field">새 비밀번호 확인
            <input class="input" type="password" name="newPasswordConfirm" autocomplete="new-password" required>
            <span class="hint" data-hint-for="newPasswordConfirm" hidden></span>
        </label>
        <button class="btn primary lg" id="password-submit" type="submit" style="width: 100%">변경</button>
    </div>
</form>
</body>
</html>
