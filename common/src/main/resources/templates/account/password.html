<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  비밀번호 변경 SCR-C-002(비밀번호 변경 영역, FNC-C-007), 두 앱이 함께 쓰는 화면.
  forced가 true(must_change_password=1)면 안내 문구를 보이고 메뉴 없이 로그아웃만 둔다.
  내 정보 영역(FNC-C-006)과 회원 탈퇴 영역(FNC-U-004)은 각 기능의 이슈에서 이 화면에 붙인다.
-->
<head>
    <th:block th:replace="~{fragments/layout :: head('비밀번호 변경')}"/>
</head>
<body class="we">
<!-- th:replace가 th:if·th:unless보다 먼저 처리되므로 조건은 th:block으로 감싼다 -->
<th:block th:if="${forced}">
    <header class="we topbar" data-header="forced">
        <span class="brand">White Eyes<small th:text="${admin} ? '관리자' : '혼잡 현황'">관리자</small></span>
        <div class="head-right">
            <form th:action="@{/logout}" method="post"><button class="btn secondary sm" type="submit">로그아웃</button></form>
        </div>
    </header>
</th:block>
<th:block th:unless="${forced}">
    <header th:replace="${admin} ? ~{fragments/layout :: adminHeader('')} : ~{fragments/layout :: userHeader('')}"></header>
</th:block>

<main style="padding: 64px 24px; display: flex; justify-content: center">
    <form class="panel" id="password-form" novalidate style="width: 100%; max-width: 480px; overflow: hidden">
        <div class="panel-head">
            <div><p class="eyebrow">MY ACCOUNT</p><h2 style="margin-top: 4px">비밀번호 변경</h2></div>
        </div>
        <div style="padding: 22px; display: flex; flex-direction: column; gap: 16px">
            <p th:if="${forced}" id="forced-notice"
               style="padding: 12px 14px; border: 1px solid #6b5520; border-radius: 8px; background: #241d0f; color: #ffd27a; font-size: 12px">임시 비밀번호로 로그인했습니다. 새 비밀번호를 설정하세요.</p>
            <label class="field">현재 비밀번호
                <input class="input" type="password" name="currentPassword" autocomplete="current-password" required>
                <span class="hint" data-hint-for="currentPassword"></span>
            </label>
            <label class="field">새 비밀번호
                <input class="input" type="password" name="newPassword" autocomplete="new-password" required>
                <span class="hint" data-hint-for="newPassword">8~64자, 영문·숫자를 각각 1자 이상(특수문자 가능)</span>
            </label>
            <label class="field">새 비밀번호 확인
                <input class="input" type="password" name="newPasswordConfirm" autocomplete="new-password" required>
                <span class="hint" data-hint-for="newPasswordConfirm"></span>
            </label>
            <button class="btn primary lg" id="password-submit" type="submit" style="width: 100%">변경</button>
        </div>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"/>
<script type="module" th:src="@{/js/pages/password-change.js}"></script>
</body>
</html>
