<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  비밀번호 변경 SCR-C-002(비밀번호 변경 영역, FNC-C-007), 두 앱이 함께 쓰는 화면.
  forced가 true(must_change_password=1)면 안내 문구를 보이고 메뉴 없이 로그아웃만 둔다.
  비밀번호 패널은 passwordPanel 조각으로 나눠, 내 정보 화면(me.html, FNC-C-006)이 같은 패널을 아래에 붙여 쓴다.
  회원 탈퇴 영역(FNC-U-004)은 그 기능의 이슈에서 붙인다.
-->
<head>
    <th:block th:replace="~{fragments/layout :: head('비밀번호 변경')}"/>
</head>
<body class="we">
<!-- th:replace가 th:if·th:unless보다 먼저 처리되므로 조건은 th:block으로 감싼다 -->
<th:block th:if="${forced}">
    <header class="we topbar" data-header="forced">
        <span class="brand">White Eyes<small th:text="${admin} ? '관리자' : '혼잡 현황'">관리자</small></span>
        <div class="head-right">
            <form th:action="@{/logout}" method="post"><button class="btn secondary sm" type="submit">로그아웃</button></form>
        </div>
    </header>
</th:block>
<th:block th:unless="${forced}">
    <header th:replace="${admin} ? ~{fragments/layout :: adminHeader('')} : ~{fragments/layout :: userHeader('')}"></header>
</th:block>

<main style="padding: 64px 24px; display: flex; justify-content: center">
    <th:block th:replace="~{account/password-panel :: passwordPanel}"/>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"/>
<script type="module" th:src="@{/js/pages/password-change.js}"></script>
</body>
</html>
