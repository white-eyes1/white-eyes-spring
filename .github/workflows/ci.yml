name: ci
on:
  pull_request:
    branches: [dev, main]
  # dev·main에 머지된 결과도 검사한다(PR CI는 올린 시점의 dev 기준이라 합친 결과를 검증하지 않음)
  push:
    branches: [dev, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # 기본값은 기본 브랜치(main)에서만 캐시를 저장한다. dev·main push가 저장하고, dev 대상 PR은 그 캐시를 읽는다
          cache-read-only: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main') }}
      # Java 형식 검사(spotlessCheck)는 build가 함께 돌린다(code-conventions.md 3-1)
      - run: ./gradlew build
      # 화면 JS 형식·검사(code-conventions.md 5-1). 도구 버전은 package-lock.json에 고정
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint

  # dev에 머지된 결과만 이미지로 올린다(GHCR). 배포는 각 VM에서 이 이미지를 받아 하는 스크립트로 한다(overview.md '배포 방식')
  # tools(시연용 통계 도구, FNC-A-051·052)도 올린다: dev에서 시연용 통계를 만들 때 쓴다. 운영(prod)에서는 받아 쓰지 않는다(Dockerfile 주석)
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-${{ matrix.target }}-${{ github.ref }}
      cancel-in-progress: false
    strategy:
      matrix:
        target: [user, admin, tools]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/white-eyes-${{ matrix.target }}
          # dev: 움직이는 태그, dev-<짧은 SHA>: 배포 때 버전 지정용
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 두 target이 같은 build 단계를 쓰므로 캐시 범위를 나눠 서로 덮어쓰지 않게 한다
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
