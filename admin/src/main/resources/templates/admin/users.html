<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('사용자 관리')}"/>
    <link rel="stylesheet" th:href="@{/css/admin/users.css}">
</head>
<body class="we">
<header th:replace="~{fragments/layout :: adminHeader('manage')}"></header>
<!-- SCR-A-001 사용자 관리. 목록은 화면 JS(js/admin/pages/users.js)가 GET /api/v1/users(FNC-A-002)로 받아 채우고, 행의 승인(FNC-A-006)과 강제 로그아웃(FNC-A-008)도 맡는다 -->
<main class="page">
    <div class="page-heading">
        <div>
            <p class="eyebrow">USERS</p>
            <h1>사용자 관리</h1>
            <p>가입 신청을 승인하고 사용자 계정을 관리합니다.</p>
        </div>
    </div>

    <section class="panel user-panel">
        <form id="user-search-form" class="filterbar">
            <input class="input user-keyword" type="search" name="keyword" placeholder="아이디·이름 검색" aria-label="검색어">
            <select class="input" name="status" aria-label="상태">
                <option value="">상태 전체</option>
                <option value="PENDING">미승인</option>
                <option value="ACTIVE">정상</option>
                <option value="WITHDRAWN">탈퇴</option>
            </select>
            <label class="user-dates">가입일
                <input class="input" type="date" name="joinedFrom" aria-label="가입일 시작">
                ~
                <input class="input" type="date" name="joinedTo" aria-label="가입일 끝">
            </label>
            <select class="input" name="active" aria-label="활동 중">
                <option value="">활동 중 전체</option>
                <option value="true">활동 중</option>
                <option value="false">활동 안 함</option>
            </select>
            <select class="input" name="size" aria-label="표시 개수">
                <option value="20" selected>20개씩</option>
                <option value="50">50개씩</option>
                <option value="100">100개씩</option>
            </select>
            <button class="btn primary user-search" type="submit">조회</button>
        </form>

        <p id="user-list-error" class="alert user-notice" role="alert" hidden></p>
        <!-- 활동 중 필터·최근 활동 정렬이 1,000명 상한에 걸리면(truncated) 보인다 -->
        <p id="user-list-truncated" class="muted user-notice" role="status" hidden>조건에 맞는 사용자가 많아 1,000명까지만 표시합니다.</p>

        <div class="table-wrap">
            <table id="user-table" class="table">
                <thead>
                <tr>
                    <th scope="col" aria-sort="none"><button type="button" class="sort-btn" data-sort="loginId">아이디</button></th>
                    <th scope="col">이름</th>
                    <th scope="col">상태</th>
                    <th scope="col" aria-sort="descending"><button type="button" class="sort-btn" data-sort="createdAt">가입일</button></th>
                    <th scope="col" aria-sort="none"><button type="button" class="sort-btn" data-sort="lastActiveAt">최근 활동</button></th>
                    <th scope="col">활동 중</th>
                    <th scope="col" class="user-actions">동작</th>
                </tr>
                </thead>
                <tbody id="user-table-body"></tbody>
            </table>
        </div>
        <p id="user-list-empty" class="muted user-empty" hidden>조건에 맞는 사용자가 없습니다.</p>

        <div class="pager">
            <span id="user-total"></span>
            <nav id="user-pagination" class="pages" aria-label="페이지 이동"></nav>
        </div>
    </section>
</main>

<!-- 승인 취소(FNC-A-007)·강제 로그아웃(FNC-A-008) 확인 창. 제목·문구·확인 버튼 글자와 누른 행의 사용자 아이디는 users.js가 넣는다 -->
<div class="modal-stage user-modal-stage" id="user-confirm-modal" hidden>
    <div class="modal user-confirm" role="alertdialog" aria-modal="true" aria-labelledby="user-confirm-title">
        <div class="modal-head">
            <h2 id="user-confirm-title">강제 로그아웃</h2>
            <button class="icon-btn" type="button" aria-label="닫기" data-confirm-close>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>
        <div class="modal-body">
            <p id="user-confirm-message"></p>
        </div>
        <div class="modal-foot">
            <button class="btn secondary" type="button" data-confirm-close>취소</button>
            <button class="btn danger" type="button" id="user-confirm-ok">로그아웃</button>
        </div>
    </div>
</div>

<!--
  사용자 상세 창(SCR-A-002). 행을 누르면 user-detail.js가 연다. 이름·메일·연락처는 목록 행의 값을 읽기 전용으로 보여 주고
  (수정·저장은 FNC-A-004), 여기서는 비밀번호 재설정(FNC-A-005)만 한다. 임시 비밀번호는 재설정 응답을 받은 뒤에만 채우고 창을 닫으면 지운다
-->
<div class="modal-stage user-modal-stage" id="user-detail-modal" hidden>
    <div class="modal user-detail" role="dialog" aria-modal="true" aria-labelledby="user-detail-title">
        <div class="modal-head">
            <div>
                <h2 id="user-detail-title"></h2>
                <p class="muted user-detail-sub" id="user-detail-sub"></p>
            </div>
            <button class="icon-btn" type="button" aria-label="닫기" data-detail-close>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>
        <div class="modal-body">
            <div class="field">
                <label for="user-detail-name">이름</label>
                <input class="input" id="user-detail-name" type="text" readonly>
            </div>
            <div class="field">
                <label for="user-detail-email">메일</label>
                <input class="input" id="user-detail-email" type="text" readonly>
            </div>
            <div class="field">
                <label for="user-detail-phone">연락처</label>
                <input class="input" id="user-detail-phone" type="text" readonly>
            </div>
            <div class="user-temp-box" id="user-temp-password-box" hidden>
                <strong>임시 비밀번호</strong>
                <div class="user-temp-row">
                    <code id="user-temp-password"></code>
                    <button class="btn secondary" type="button" id="user-temp-copy">복사</button>
                </div>
                <span class="user-temp-note" role="status">이 창을 닫으면 다시 볼 수 없습니다. 다음 로그인 때 비밀번호 변경을 강제합니다.</span>
            </div>
        </div>
        <div class="modal-foot user-detail-foot">
            <button class="btn danger" type="button" id="user-detail-reset">비밀번호 재설정</button>
            <button class="btn secondary" type="button" data-detail-close>닫기</button>
        </div>
    </div>
</div>

<!-- 비밀번호 재설정 확인 창(FNC-A-005). 이전 비밀번호는 더 쓸 수 없고 열려 있는 세션이 끊긴다는 점을 알린다 -->
<div class="modal-stage user-modal-stage" id="user-reset-confirm-modal" hidden>
    <div class="modal user-confirm" role="alertdialog" aria-modal="true" aria-labelledby="user-reset-confirm-title">
        <div class="modal-head">
            <h2 id="user-reset-confirm-title">비밀번호 재설정</h2>
            <button class="icon-btn" type="button" aria-label="닫기" data-reset-close>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>
        <div class="modal-body">
            <p id="user-reset-confirm-message"></p>
        </div>
        <div class="modal-foot">
            <button class="btn secondary" type="button" data-reset-close>취소</button>
            <button class="btn danger" type="button" id="user-reset-confirm-ok">재설정</button>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"/>
<script type="module" th:src="@{/js/admin/pages/users.js}"></script>
</body>
</html>
