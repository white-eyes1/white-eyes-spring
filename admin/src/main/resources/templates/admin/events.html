<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('이벤트 로그')}"/>
    <link rel="stylesheet" th:href="@{/css/admin/events.css}">
</head>
<body class="we">
<header th:replace="~{fragments/layout :: adminHeader('events')}"></header>
<main class="page">
    <div class="page-heading">
        <div>
            <p class="eyebrow">EVENT CENTER</p>
            <h1>이벤트 로그</h1>
            <p>혼잡·급증·캠 이상 이벤트를 확인하고 조치를 기록합니다.</p>
        </div>
        <!-- 현재 필터 그대로 엑셀로 받는다(FNC-A-039) -->
        <button class="btn secondary" type="button" id="export-button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>내려받기
        </button>
    </div>

    <!-- 요약 카드: 현재 필터의 기간·지역·종류·검색어 기준 처리 상태별 건수(상태 필터는 받지 않음) -->
    <div class="ev-summary" aria-label="이벤트 요약">
        <div class="panel sum"><span class="muted" id="summary-total-label">전체</span><strong id="summary-total">-</strong></div>
        <div class="panel sum"><span class="muted">미확인</span><strong class="ev-unchecked" id="summary-unchecked">-</strong></div>
        <div class="panel sum"><span class="muted">확인 중</span><strong class="ev-checked" id="summary-checked">-</strong></div>
        <div class="panel sum"><span class="muted">조치완료</span><strong class="ev-resolved" id="summary-resolved">-</strong></div>
    </div>

    <section class="panel ev-panel">
        <form class="filterbar" id="event-filter" role="search" novalidate>
            <select class="control ev-select" id="filter-status" aria-label="처리 상태">
                <option value="">전체 상태</option>
                <option value="UNCHECKED">미확인</option>
                <option value="CHECKED">확인 중</option>
                <option value="RESOLVED">조치완료</option>
            </select>
            <input class="control ev-keyword" type="search" id="filter-keyword" maxlength="50"
                   placeholder="구역·지역·캠 검색" aria-label="구역·지역·캠 검색" autocomplete="off">
            <button class="btn secondary ev-detail-toggle" type="button" id="filter-detail-toggle"
                    aria-expanded="false" aria-controls="filter-detail">상세 필터</button>
            <div class="ev-detail" id="filter-detail" hidden>
                <label class="ev-field">
                    <span class="muted">기간</span>
                    <input class="control ev-date" type="date" id="filter-from" aria-label="시작일">
                    <span class="muted">~</span>
                    <input class="control ev-date" type="date" id="filter-to" aria-label="종료일">
                </label>
                <select class="control ev-select" id="filter-type" aria-label="종류">
                    <option value="">전체 종류</option>
                    <option value="CONGESTION">혼잡</option>
                    <option value="SURGE">급증</option>
                    <option value="CAM_FAULT">캠 이상</option>
                </select>
            </div>
        </form>
        <div class="table-wrap">
            <div class="dtable ev-table" role="table" aria-label="이벤트 목록">
                <div class="tr th" role="row">
                    <span role="columnheader">발생 시각</span>
                    <span role="columnheader">종류</span>
                    <span role="columnheader">구역 · 지역</span>
                    <span role="columnheader">최고 단계 · 값</span>
                    <span role="columnheader">지속</span>
                    <span role="columnheader">처리 상태</span>
                    <span role="columnheader">조치</span>
                </div>
                <div id="event-rows" role="rowgroup"></div>
                <div class="ev-empty" id="event-empty" hidden>
                    <strong>검색 결과가 없습니다</strong>
                    <p class="muted">필터나 검색어를 변경해 보세요</p>
                </div>
            </div>
        </div>
        <div class="pager">
            <span id="event-total">불러오는 중…</span>
            <div class="pages" id="event-pages"></div>
        </div>
    </section>
</main>

<!-- SCR-A-011 이벤트 상세 창 중 이벤트 정보·처리 이력(FNC-A-037). 발생 시점 영상·다시보기 이동은 FNC-A-040 -->
<div class="modal-stage ev-modal-stage" id="detail-modal" hidden>
    <div class="modal ev-modal" tabindex="-1" role="dialog" aria-modal="true" aria-label="이벤트 상세">
        <div class="modal-head">
            <div class="ev-modal-title">
                <span id="detail-type-chip"></span>
                <h2 id="detail-title"></h2>
                <span id="detail-status-chip"></span>
            </div>
            <button class="icon-btn" type="button" aria-label="닫기" data-close>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>
        <div class="modal-body ev-modal-body">
            <dl class="kv" id="detail-info"></dl>
            <div class="ev-history">
                <strong>처리 이력</strong>
                <div id="detail-histories"></div>
            </div>
        </div>
        <div class="modal-foot">
            <button class="btn primary" type="button" data-close>닫기</button>
        </div>
    </div>
</div>

<!-- SCR-A-011 조치 완료 창(FNC-A-038). 표의 [조치하기]로 열린다 -->
<div class="modal-stage ev-modal-stage" id="action-modal" hidden>
    <form class="modal ev-action-modal" id="action-form" tabindex="-1" role="dialog" aria-modal="true"
          aria-labelledby="action-title" novalidate>
        <div class="modal-head">
            <div>
                <h2 id="action-title">조치 완료 처리</h2>
                <p class="muted ev-action-sub" id="action-sub"></p>
            </div>
            <button class="icon-btn" type="button" aria-label="닫기" data-action-close>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>
        <div class="modal-body">
            <fieldset class="field ev-action-field">
                <legend>조치 항목 (필수)</legend>
                <div class="ev-opts">
                    <label class="ev-opt"><input type="radio" name="actionCode" value="ONSITE_OK"><i></i>현장 확인·정상</label>
                    <label class="ev-opt"><input type="radio" name="actionCode" value="STAFF"><i></i>인력 배치</label>
                    <label class="ev-opt"><input type="radio" name="actionCode" value="FALSE_ALARM"><i></i>오탐</label>
                    <label class="ev-opt"><input type="radio" name="actionCode" value="CAM_CHECK"><i></i>캠 점검 요청</label>
                    <label class="ev-opt"><input type="radio" name="actionCode" value="OTHER"><i></i>기타</label>
                </div>
            </fieldset>
            <label class="field">
                <span>조치 메모 <span class="muted">(기타면 필수, 200자 이하)</span></span>
                <textarea class="input ev-note" id="action-note" maxlength="200" rows="3" autocomplete="off"></textarea>
                <span class="hint ev-note-count" id="action-note-count">0 / 200</span>
            </label>
            <p class="muted ev-action-help">처리자와 처리 시각은 저장할 때 자동으로 기록됩니다. 조치완료 뒤에는 되돌릴 수 없습니다.</p>
        </div>
        <div class="modal-foot">
            <button class="btn secondary" type="button" data-action-close>취소</button>
            <button class="btn primary" type="submit" id="action-save" disabled>조치완료로 저장</button>
        </div>
    </form>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"/>
<script type="module" th:src="@{/js/admin/pages/events.js}"></script>
</body>
</html>
