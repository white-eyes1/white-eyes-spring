<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('캠 관리')}"/>
    <link rel="stylesheet" th:href="@{/css/admin/cameras.css}">
</head>
<body class="we">
<header th:replace="~{fragments/layout :: adminHeader('manage')}"></header>
<main class="page">
    <div class="page-heading">
        <div>
            <p class="eyebrow">CAMERAS</p>
            <h1>캠 관리</h1>
            <p>구역마다 캠 1대. 가동하면 분석 서버가 영상을 분석하고, 더미 캠은 처음 한 번 준비(분석)를 거칩니다.</p>
        </div>
        <button type="button" class="btn primary" id="camera-add">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>캠 등록
        </button>
    </div>

    <section class="panel cam-panel">
        <div class="filterbar">
            <span class="muted cam-summary" id="camera-summary">불러오는 중…</span>
        </div>
        <div class="table-wrap">
            <div class="dtable cam-table" role="table" aria-label="캠 목록">
                <div class="tr th" role="row">
                    <span role="columnheader">구역</span>
                    <span role="columnheader">캠 이름</span>
                    <span role="columnheader">입력 방식</span>
                    <span role="columnheader">상태</span>
                    <span role="columnheader">준비 진행률</span>
                    <span role="columnheader">오류 내용</span>
                    <span role="columnheader" class="cam-right">동작</span>
                </div>
                <div id="camera-rows" role="rowgroup"></div>
                <p class="muted cam-empty" id="camera-empty" hidden>등록된 캠이 없습니다. '캠 등록'으로 구역에 캠을 추가하세요.</p>
            </div>
        </div>
    </section>
</main>

<!-- SCR-A-007 캠 등록 창 -->
<div class="modal-stage cam-modal-stage" id="camera-modal" hidden>
    <form class="modal cam-modal" id="camera-form" role="dialog" aria-modal="true" aria-label="캠 등록" novalidate>
        <div class="modal-head">
            <h2>캠 등록</h2>
            <button class="icon-btn" type="button" aria-label="닫기" data-close>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>
        <div class="modal-body">
            <p class="alert" id="camera-form-error" role="alert" hidden></p>
            <div class="field">
                <label for="camera-zone">구역</label>
                <select class="input" id="camera-zone" name="zoneId"></select>
                <span class="hint" id="camera-zone-hint">캠이 없는 구역만 고를 수 있습니다(구역당 1대)</span>
                <span class="hint err" data-error-for="zoneId" hidden></span>
            </div>
            <div class="field">
                <label for="camera-name">캠 이름</label>
                <input class="input" id="camera-name" name="name" type="text" maxlength="50" autocomplete="off">
                <span class="hint err" data-error-for="name" hidden></span>
            </div>
            <div class="field">
                <span id="camera-type-label">입력 방식</span>
                <div class="seg" role="radiogroup" aria-labelledby="camera-type-label">
                    <label><input type="radio" name="sourceType" value="DUMMY" checked><span>더미 영상</span></label>
                    <label><input type="radio" name="sourceType" value="LIVE"><span>라이브(RTSP)</span></label>
                </div>
            </div>
            <div class="field">
                <label for="camera-uri">영상 주소</label>
                <input class="input" id="camera-uri" name="sourceUri" type="text" maxlength="255" autocomplete="off">
                <span class="hint" id="camera-uri-hint"></span>
                <span class="hint err" data-error-for="sourceUri" hidden></span>
            </div>
            <p class="muted cam-note">파일이 실제로 있는지는 가동할 때 분석 서버가 확인합니다.</p>
        </div>
        <div class="modal-foot">
            <button class="btn secondary" type="button" data-close>취소</button>
            <button class="btn primary" type="submit" id="camera-save">저장</button>
        </div>
    </form>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"/>
<script type="module" th:src="@{/js/admin/pages/cameras.js}"></script>
</body>
</html>
