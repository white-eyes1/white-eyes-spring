<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('관리자 관리')}"/>
    <link rel="stylesheet" th:href="@{/css/admin/admins.css}">
</head>
<body class="we">
<header th:replace="~{fragments/layout :: adminHeader('manage')}"></header>
<!--
  SCR-A-003 관리자 관리(최고 관리자 전용). 목록은 화면 JS(js/admin/pages/admins.js)가 GET /api/v1/admins(FNC-A-003)로 받아 채우고,
  관리자 추가 창은 POST /api/v1/admins(FNC-A-009)로 계정을 만들고, 행의 강제 로그아웃(FNC-A-008)은 확인 창 뒤 POST /api/v1/admins/{id}/logout으로 보낸다.
  행의 비활성화·활성화(FNC-A-011)도 같은 확인 창을 거쳐 POST /api/v1/admins/{id}/disable·enable로 보낸다. 행의 수정·비밀번호 재설정(FNC-A-010)은 수정 창(js/admin/admin-detail.js)을 연다.
-->
<main class="page">
    <div class="page-heading">
        <div>
            <p class="eyebrow">ADMINS · 최고 관리자 전용</p>
            <h1>관리자 관리</h1>
            <p>관리자 계정을 만들면 임시 비밀번호를 한 번만 보여 줍니다.</p>
        </div>
        <button class="btn primary" type="button" id="admin-add">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            관리자 추가
        </button>
    </div>

    <section class="panel admin-panel">
        <p id="admin-list-error" class="alert admin-notice" role="alert" hidden></p>

        <div class="table-wrap">
            <!-- 본인 행에 '본인 계정'을 보이려고 현재 로그인 아이디를 JS에 넘긴다 -->
            <table id="admin-table" class="table" th:data-current-login-id="${currentLoginId}">
                <thead>
                <tr>
                    <th scope="col" aria-sort="none"><button type="button" class="sort-btn" data-sort="loginId">아이디</button></th>
                    <th scope="col">이름</th>
                    <th scope="col">역할</th>
                    <th scope="col">상태</th>
                    <th scope="col">최근 활동</th>
                    <th scope="col">활동 중</th>
                    <th scope="col" class="admin-actions">동작</th>
                </tr>
                </thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>
        <p id="admin-list-empty" class="muted admin-empty" hidden>관리자 계정이 없습니다.</p>

        <div class="pager">
            <span id="admin-total"></span>
            <nav id="admin-pagination" class="pages" aria-label="페이지 이동"></nav>
        </div>
    </section>
</main>

<!-- 관리자 추가 창(FNC-A-009). 시안이 없어 캠 등록 창(SCR-A-007)과 같은 모양이다. 만들면 같은 창에 임시 비밀번호를 한 번만 보여 준다 -->
<div class="modal-stage admin-modal-stage" id="admin-modal" hidden>
    <form class="modal admin-modal" id="admin-form" role="dialog" aria-modal="true" aria-label="관리자 추가" novalidate>
        <div class="modal-head">
            <h2>관리자 추가</h2>
            <button class="icon-btn" type="button" aria-label="닫기" data-close>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>
        <div class="modal-body" id="admin-form-fields">
            <p class="alert" id="admin-form-error" role="alert" hidden></p>
            <div class="field">
                <label for="admin-login-id">아이디</label>
                <input class="input" id="admin-login-id" name="loginId" type="text" maxlength="20" autocomplete="off">
                <span class="hint">영문 소문자로 시작하는 4~20자의 영문 소문자·숫자</span>
                <span class="hint err" data-error-for="loginId" hidden></span>
            </div>
            <div class="field">
                <label for="admin-name">이름</label>
                <input class="input" id="admin-name" name="name" type="text" maxlength="50" autocomplete="off">
                <span class="hint err" data-error-for="name" hidden></span>
            </div>
            <div class="field">
                <label for="admin-email">메일(선택)</label>
                <input class="input" id="admin-email" name="email" type="email" maxlength="100" autocomplete="off">
                <span class="hint err" data-error-for="email" hidden></span>
            </div>
            <div class="field">
                <label for="admin-phone">연락처(선택)</label>
                <input class="input" id="admin-phone" name="phone" type="tel" maxlength="20" autocomplete="off">
                <span class="hint err" data-error-for="phone" hidden></span>
            </div>
        </div>
        <div class="modal-body admin-created" id="admin-created" hidden>
            <p><b id="admin-created-login-id"></b> 계정을 만들었습니다. 첫 로그인 때 비밀번호를 바꿔야 합니다.</p>
            <div class="field">
                <span>임시 비밀번호</span>
                <div class="admin-temp-password">
                    <code id="admin-temp-password"></code>
                    <button class="btn secondary sm" type="button" id="admin-temp-copy">복사</button>
                </div>
                <span class="hint err" role="status">이 창을 닫으면 임시 비밀번호를 다시 볼 수 없습니다.</span>
            </div>
        </div>
        <div class="modal-foot" id="admin-form-foot">
            <button class="btn secondary" type="button" data-close>취소</button>
            <button class="btn primary" type="submit" id="admin-save">만들기</button>
        </div>
        <div class="modal-foot" id="admin-created-foot" hidden>
            <button class="btn primary" type="button" data-close>닫기</button>
        </div>
    </form>
</div>

<!-- 행 동작 확인 창(강제 로그아웃 FNC-A-008, 비활성화·활성화 FNC-A-011 공용). 제목·문구·버튼은 admins.js가 채운다 -->
<div class="modal-stage admin-modal-stage" id="admin-confirm-modal" hidden>
    <div class="modal admin-confirm" role="alertdialog" aria-modal="true" aria-labelledby="admin-confirm-title">
        <div class="modal-head">
            <h2 id="admin-confirm-title"></h2>
            <button class="icon-btn" type="button" aria-label="닫기" data-confirm-close>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>
        <div class="modal-body">
            <p id="admin-confirm-message"></p>
        </div>
        <div class="modal-foot">
            <button class="btn secondary" type="button" data-confirm-close>취소</button>
            <button class="btn danger" type="button" id="admin-confirm-ok"></button>
        </div>
    </div>
</div>

<!--
  관리자 수정 창(FNC-A-010, SCR-A-002와 같은 창). 행의 '수정'·'비밀번호 재설정' 버튼을 누르면 admin-detail.js가 연다. 아이디는 제목에 읽기 전용으로 보이고,
  이름·메일·연락처를 고쳐 '저장'하면 PATCH /api/v1/admins/{id} 뒤 창을 닫고 목록을 다시 읽는다. 형식 오류는 칸 아래에 보인다.
  '비밀번호 재설정'의 임시 비밀번호는 재설정 응답을 받은 뒤에만 채우고 창을 닫으면 지운다
-->
<div class="modal-stage admin-modal-stage" id="admin-detail-modal" hidden>
    <form class="modal admin-detail" id="admin-detail-form" role="dialog" aria-modal="true" aria-labelledby="admin-detail-title" novalidate>
        <div class="modal-head">
            <div>
                <h2 id="admin-detail-title"></h2>
                <p class="muted admin-detail-sub" id="admin-detail-sub"></p>
            </div>
            <button class="icon-btn" type="button" aria-label="닫기" data-detail-close>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>
        <div class="modal-body">
            <p class="alert" id="admin-detail-error" role="alert" hidden></p>
            <div class="field">
                <label for="admin-detail-name">이름</label>
                <input class="input" id="admin-detail-name" name="name" type="text" maxlength="50" autocomplete="off">
                <span class="hint err" data-error-for="name" hidden></span>
            </div>
            <div class="field">
                <label for="admin-detail-email">메일</label>
                <input class="input" id="admin-detail-email" name="email" type="email" maxlength="100" autocomplete="off">
                <span class="hint err" data-error-for="email" hidden></span>
            </div>
            <div class="field">
                <label for="admin-detail-phone">연락처</label>
                <input class="input" id="admin-detail-phone" name="phone" type="tel" maxlength="20" autocomplete="off">
                <span class="hint err" data-error-for="phone" hidden></span>
            </div>
            <div class="admin-temp-box" id="admin-temp-password-box" hidden>
                <strong>임시 비밀번호</strong>
                <div class="admin-temp-row">
                    <code id="admin-detail-temp-password"></code>
                    <button class="btn secondary" type="button" id="admin-detail-temp-copy">복사</button>
                </div>
                <span class="admin-temp-note" role="status">이 창을 닫으면 다시 볼 수 없습니다. 다음 로그인 때 비밀번호 변경을 강제합니다.</span>
            </div>
        </div>
        <div class="modal-foot admin-detail-foot">
            <button class="btn danger" type="button" id="admin-detail-reset">비밀번호 재설정</button>
            <div class="admin-detail-actions">
                <button class="btn secondary" type="button" data-detail-close>취소</button>
                <button class="btn primary" type="submit" id="admin-detail-save">저장</button>
            </div>
        </div>
    </form>
</div>

<!-- 비밀번호 재설정 확인 창(FNC-A-010). 이전 비밀번호는 더 쓸 수 없고 열려 있는 세션이 끊긴다는 점을 알린다 -->
<div class="modal-stage admin-modal-stage" id="admin-reset-confirm-modal" hidden>
    <div class="modal admin-confirm" role="alertdialog" aria-modal="true" aria-labelledby="admin-reset-confirm-title">
        <div class="modal-head">
            <h2 id="admin-reset-confirm-title">비밀번호 재설정</h2>
            <button class="icon-btn" type="button" aria-label="닫기" data-reset-close>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"></path></svg>
            </button>
        </div>
        <div class="modal-body">
            <p id="admin-reset-confirm-message"></p>
        </div>
        <div class="modal-foot">
            <button class="btn secondary" type="button" data-reset-close>취소</button>
            <button class="btn danger" type="button" id="admin-reset-confirm-ok">재설정</button>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"/>
<script type="module" th:src="@{/js/admin/pages/admins.js}"></script>
</body>
</html>
