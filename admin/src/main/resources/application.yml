spring:
  application:
    name: white-eyes-admin
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      table-name: SPRING_SESSION_ADMIN
      cleanup-cron: 0 * * * * *
  flyway:
    enabled: true

server:
  port: 8081
  servlet:
    context-path: /admin

management:
  endpoints:
    web:
      exposure:
        include: health
