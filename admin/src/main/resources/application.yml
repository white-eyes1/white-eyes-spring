spring:
  application:
    name: white-eyes-admin
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      table-name: SPRING_SESSION_ADMIN
      cleanup-cron: 0 * * * * *
  flyway:
    enabled: true

server:
  port: 8081
  servlet:
    context-path: /admin
    session:
      cookie:
        name: ADMIN_SESSION

# 최고 관리자 최초 등록용(FNC-A-001). 값은 환경변수로만 준다
super-admin:
  login-id: ${SUPER_ADMIN_LOGIN_ID:}
  initial-password: ${SUPER_ADMIN_INITIAL_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health
