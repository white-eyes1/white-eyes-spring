plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':common')
    // 로그인(FNC-C-001): Boot 보안 자동 설정은 관리자 앱만 켠다
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Flyway는 관리자 앱만 실행 (conventions.md '기술 스택')
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-mysql'
    // 다각형 계산: 내부 점(getInteriorPoint) (conventions.md '주요 라이브러리')
    implementation 'org.locationtech.jts:jts-core:1.20.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // 통계 엑셀 다운로드(FNC-C-023) 시험에서 받은 파일을 열어 본다
    testImplementation 'org.apache.poi:poi-ooxml:5.5.1'
    testRuntimeOnly 'com.h2database:h2'
}
