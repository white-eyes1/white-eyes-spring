# white-eyes 웹 서버(nginx) 설정. 외부에서 접근할 수 있는 유일한 입구(포트 80)다.
# 규칙의 원본은 white-eyes-docs conventions.md 'nginx 경로 규칙'이다. 규칙을 바꾸면 명세를 먼저 고친다.
#
# 서버 주소는 아래 upstream 세 곳만 환경에 맞게 바꾼다(user 앱 8080, admin 앱 웹 8081, 분석 서버 5000).
# 분석 서버로 보낼 내부 토큰(INTERNAL_API_TOKEN) 값은 이 파일에 쓰지 않는다. 같은 폴더의 internal-token.conf.example을
# 복사해 /etc/nginx/internal-token.conf 로 두고 값만 채운다(그 파일은 저장소에 올리지 않는다).
# 영상·좌표 파일이 있는 공유 스토리지는 /srv/media 에 읽기 전용으로 마운트한다.
# proxy.inc·sse.inc 는 이 파일과 같은 폴더(/etc/nginx/)에 둔다. 위치(location)에 proxy_set_header가 하나라도 있으면
# 바깥 설정의 proxy_set_header를 물려받지 못하므로, 공통 헤더는 proxy.inc 로 모아 위치마다 include 한다.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # $internal_api_token 변수를 정의한다(값은 저장소 밖 파일에 둔다)
    include /etc/nginx/internal-token.conf;

    # 실시간 화면 요청 주소(/admin/live/{cameraId}[/snapshot])에서 카메라 번호를 뽑는다. auth_request 하위 요청이
    # 관리자 앱 권한 확인 API에 넘길 값이다(auth_request 주소에는 변수를 쓸 수 없고, 하위 요청에서도 $request_uri는
    # 처음 요청의 주소를 가리킨다). 숫자가 아니면 빈 값이라 관리자 앱이 거부한다.
    map $request_uri $live_camera_id {
        default "";
        "~^/admin/live/(?<cid>[0-9]+)(?:/snapshot)?(?:\?.*)?$" $cid;
    }

    upstream user_app {
        server 127.0.0.1:8080;
        keepalive 16;
    }
    upstream admin_app {
        server 127.0.0.1:8081;
        keepalive 16;
    }
    upstream analyzer {
        server 127.0.0.1:5000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # ---- 내부 API 차단 -----------------------------------------------------------------------
        # 내부 API는 관리자 앱 8082 포트로만 열려 있지만, 실수로 노출되지 않도록 한 번 더 막는다
        location ^~ /internal/       { return 404; }
        location ^~ /admin/internal/ { return 404; }

        # ---- 실시간 화면·카드 미리보기(FNC-A-041·042) ---------------------------------------------
        # 관리자 앱에 권한을 확인(auth_request)해 204일 때만 분석 서버로 전달한다. 분석 서버로 보낼 때 X-Internal-Token을 붙인다
        # (클라이언트가 보낸 같은 이름의 헤더는 덮어쓴다). 카드 미리보기는 요청마다 확인하고 캐시하지 않는다.
        # 정규식 위치 두 개는 서로 겹치지 않는다(끝이 /snapshot 인지 숫자인지).
        location ~ ^/admin/live/(?<camera_id>[0-9]+)/snapshot$ {
            # 권한을 확인한 번호(처음 요청의 원래 주소에서 뽑음)와 분석 서버로 보낼 번호(정리된 주소에서 뽑음)가 다르면 막는다.
            # 주소를 비틀어(예: /admin/live/1/../2/snapshot) 확인한 캠과 다른 캠의 영상을 받는 일을 막기 위한 것이다.
            if ($live_camera_id != $camera_id) { return 403; }
            auth_request /_live_auth;
            include /etc/nginx/proxy.inc;
            proxy_pass http://analyzer/analyzer/v1/cameras/$camera_id/snapshot;
            proxy_set_header X-Internal-Token $internal_api_token;
            proxy_cache off;
            # 분석 서버도 같은 헤더를 보내므로 숨긴 뒤 한 번만 붙인다(실제 분석 서버와 붙여 보다 두 번 나오는 것을 발견)
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location ~ ^/admin/live/(?<camera_id>[0-9]+)$ {
            # 권한을 확인한 번호(처음 요청의 원래 주소에서 뽑음)와 분석 서버로 보낼 번호(정리된 주소에서 뽑음)가 다르면 막는다.
            # 주소를 비틀어(예: /admin/live/1/../2/snapshot) 확인한 캠과 다른 캠의 영상을 받는 일을 막기 위한 것이다.
            if ($live_camera_id != $camera_id) { return 403; }
            auth_request /_live_auth;
            include /etc/nginx/proxy.inc;
            proxy_pass http://analyzer/analyzer/v1/cameras/$camera_id/live;
            proxy_set_header X-Internal-Token $internal_api_token;
            # 스트림(MJPEG)이라 모아 두지 않고 바로 내보낸다. 영상은 연결을 시작할 때만 권한을 확인한다
            proxy_buffering off;
            proxy_cache off;
        }

        # auth_request가 부르는 내부 경로. 관리자 앱 권한 확인 API에 카메라 번호와 쿠키(ADMIN_SESSION)를 넘기고 본문은 보내지 않는다.
        # 응답은 204·401·403만 쓴다(그 밖의 응답은 auth_request가 500으로 바꾼다).
        location = /_live_auth {
            internal;
            include /etc/nginx/proxy.inc;
            proxy_pass http://admin_app/admin/api/v1/live/auth?cameraId=$live_camera_id;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # ---- 통계·알림 SSE(FNC-C-022, FNC-A-048) -------------------------------------------------
        # 정확히 일치하는 위치라 아래 / · /admin/ 규칙보다 먼저 맞는다. 앱이 30초마다 주석 줄을 보내 연결을 유지한다.
        location = /api/v1/stats/stream {
            include /etc/nginx/proxy.inc;
            include /etc/nginx/sse.inc;
            proxy_pass http://user_app;
        }
        location = /admin/api/v1/stats/stream {
            include /etc/nginx/proxy.inc;
            include /etc/nginx/sse.inc;
            proxy_pass http://admin_app;
        }
        location = /admin/api/v1/notifications/stream {
            include /etc/nginx/proxy.inc;
            include /etc/nginx/sse.inc;
            proxy_pass http://admin_app;
        }

        # ---- 녹화 영상·좌표 파일 전송(FNC-A-044) -------------------------------------------------
        # 관리자 앱이 권한을 확인한 뒤 응답 헤더 X-Accel-Redirect: /protected/media/{경로} 로 지정할 때만 전송한다.
        # internal 이라 브라우저가 주소를 직접 입력하면 404다. 영상은 Range 요청(구간 이동)을 지원한다.
        location /protected/media/ {
            internal;
            alias /srv/media/;
        }
        # 좌표 파일(.json.gz)은 브라우저가 자동으로 압축을 풀어 JSON으로 받는다. 앱은 이 헤더를 붙이지 않으므로 중복되지 않는다
        location ~ ^/protected/media/(?<media_path>.+\.json\.gz)$ {
            internal;
            alias /srv/media/$media_path;
            default_type application/json;
            add_header Content-Encoding gzip always;
        }

        # ---- 앱으로 나누기 -----------------------------------------------------------------------
        location /admin/ {
            include /etc/nginx/proxy.inc;
            proxy_pass http://admin_app;
        }

        location / {
            include /etc/nginx/proxy.inc;
            proxy_pass http://user_app;
        }
    }
}
