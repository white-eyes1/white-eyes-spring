spring:
  application:
    name: white-eyes-user
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      table-name: SPRING_SESSION_USER
      cleanup-cron: 0 * * * * *
  flyway:
    enabled: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: USER_SESSION

management:
  endpoints:
    web:
      exposure:
        include: health

# 실시간 통계 갱신(FNC-C-022): 앱마다 5초에 한 번 최신 1분 통계 시각을 확인해 SSE로 보낸다
stats:
  stream:
    auto-poll: true
