spring:
  application:
    name: white-eyes-user
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      table-name: SPRING_SESSION_USER
      cleanup-cron: 0 * * * * *
  flyway:
    enabled: false

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: USER_SESSION

management:
  endpoints:
    web:
      exposure:
        include: health
