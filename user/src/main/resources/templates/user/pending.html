<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: head('승인 대기')}"/>
</head>
<body class="we">
<!-- SCR-U-002: 승인 대기 계정은 다른 메뉴를 쓸 수 없어 헤더에 이름만 둔다 -->
<header class="topbar"><span class="brand">White Eyes</span></header>
<main style="padding: 96px 24px; display: flex; justify-content: center">
    <section class="panel" style="width: 100%; max-width: 480px; padding: 36px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
        <div style="width: 56px; height: 56px; display: grid; place-items: center; border-radius: 50%; background: rgba(245,158,11,.14); color: #ffc15a">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        </div>
        <!-- 문구는 명세(FNC-U-003 정상 결과)를 따른다 -->
        <h1 style="font-size: 20px">관리자 승인을 기다리고 있습니다</h1>
        <p class="muted" style="font-size: 13px">가입 신청이 접수되었습니다. 관리자가 승인하면 통계 화면을 이용할 수 있습니다.</p>
        <!-- 승인되어도 이미 로그인한 세션은 이 화면에 머물러, 다시 로그인하도록 안내한다(screens.md SCR-U-002, #249) -->
        <p class="muted" style="font-size: 13px">승인이 완료되면 로그아웃한 뒤 다시 로그인해 주세요.</p>
        <!-- 로그아웃(FNC-C-002). th:action이 CSRF 토큰을 숨은 칸으로 넣는다 -->
        <form th:action="@{/logout}" method="post" style="margin-top: 6px">
            <button class="btn secondary" type="submit">로그아웃</button>
        </form>
    </section>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"/>
</body>
</html>
