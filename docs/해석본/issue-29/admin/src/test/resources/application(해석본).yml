# [해석본] 원본: admin/src/test/resources/application.yml (feature/29-check-login-id 브랜치)
# 관련 이슈: #29(FNC-U-001)
# [무엇] 관리자 앱(admin) 테스트 설정. #29는 사용자 앱 기능인데 왜 admin 설정까지 바꿨는가?
#   UserAccount 엔티티를 common 모듈에 뒀기 때문이다. 관리자 앱도 common의 엔티티를 스캔하므로(AdminApplication의 @EntityScan),
#   user_account 테이블이 없으면 AdminApplicationTests도 validate에서 실패한다.
# [Flyway와의 관계] admin 테스트는 H2에서 Flyway(V1 세션 테이블)를 실제로 돌린다. V1에는 user_account가 없으므로
#   Flyway가 끝난 뒤 Hibernate가 create-drop으로 user_account를 만든다. 세션 테이블은 Flyway가 만든 그대로 둔다.
# [다른 브랜치와 합칠 때] #15·#16도 같은 자리에 TODO(#11) create-drop을 넣었다. 충돌하면 TODO 두 줄을 같이 남긴다.
spring:
  datasource:
    url: jdbc:h2:mem:admin;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      # TODO: user_account 마이그레이션이 생기면 지우고 validate로 되돌린다
      ddl-auto: create-drop
