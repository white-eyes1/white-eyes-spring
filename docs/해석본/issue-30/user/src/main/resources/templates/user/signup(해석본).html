<!DOCTYPE html>
<!--
  [해석본] 원본: user/src/main/resources/templates/user/signup.html (feature/30-signup 브랜치)
  관련 이슈: #30(FNC-U-002), API: POST /api/v1/signup (public.md), 화면: SCR-U-001

  [무엇] 회원가입 화면 템플릿. 동작은 js/pages/signup.js가 맡고 여기에는 인라인 스크립트·onclick이 없다(code-conventions 5-3).
  [스타일] CSS는 아직 없다. 공통 화면 틀(레이아웃·CSS)이 생기면 맞춘다.
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- common/api.js가 읽는다. CSRF 토큰은 보안 설정이 생기기 전에는 비어 있다 -->
    <!-- [해석] api.js가 읽어 API 주소 앞에 붙인다. 사용자 앱에서는 "/"가 들어간다. -->
    <meta name="context-path" th:content="@{/}">
    <!-- [해석] Spring Security가 생기면 요청 속성 _csrf에 토큰이 들어온다. 지금처럼 없으면 ?.가 null을 내고 Thymeleaf가 content를 뺀다. -->
    <!-- [해석] 그래서 보안 설정(#3·#4)이 생겨도 이 템플릿은 고칠 필요가 없다. -->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <title>회원가입</title>
    <!-- [해석] type="module"은 자동으로 defer라서 head에 둬도 폼이 다 그려진 뒤 실행된다. -->
    <script type="module" th:src="@{/js/pages/signup.js}"></script>
</head>
<body>
<main>
    <h1>회원가입</h1>
    <!-- [해석] novalidate: 브라우저 기본 검사 말풍선을 끄고, 서버가 준 칸별 문구 하나로 보이게 한다. -->
    <form id="signup-form" novalidate>
        <!-- [해석] fieldErrors가 없는 오류(서버 연결 실패 등)를 보이는 자리. role="alert"는 화면 읽기 프로그램이 바로 읽게 한다. -->
        <p id="form-error" role="alert"></p>

        <div>
            <label for="loginId">아이디</label>
            <!-- [해석] maxlength·required는 입력 편의일 뿐이다(novalidate라 제출을 막지 않음). 규칙 검사는 서버가 한다. -->
            <input id="loginId" name="loginId" type="text" maxlength="20" autocomplete="username" required>
            <!-- [해석] type="button": 폼 안의 button은 기본이 submit이라, 명시하지 않으면 중복 확인을 누를 때 가입 요청이 나간다. -->
            <button type="button" id="check-login-id">중복 확인</button>
            <p id="login-id-status" aria-live="polite"></p>
            <p data-error-for="loginId" role="alert"></p>
        </div>

        <div>
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" maxlength="64" autocomplete="new-password" required>
            <p data-error-for="password" role="alert"></p>
        </div>

        <div>
            <label for="passwordConfirm">비밀번호 확인</label>
            <input id="passwordConfirm" name="passwordConfirm" type="password" maxlength="64"
                   autocomplete="new-password" required>
            <p data-error-for="passwordConfirm" role="alert"></p>
        </div>

        <div>
            <label for="name">이름</label>
            <input id="name" name="name" type="text" maxlength="50" autocomplete="name" required>
            <p data-error-for="name" role="alert"></p>
        </div>

        <div>
            <label for="email">메일(선택)</label>
            <input id="email" name="email" type="email" maxlength="100" autocomplete="email">
            <p data-error-for="email" role="alert"></p>
        </div>

        <div>
            <label for="phone">연락처(선택)</label>
            <input id="phone" name="phone" type="tel" maxlength="20" autocomplete="tel">
            <p data-error-for="phone" role="alert"></p>
        </div>

        <!-- [해석] SCR-U-001 '중복 확인을 마쳐야 활성'. 처음에는 꺼진 상태로 그리고, signup.js가 확인을 마치면 켠다. -->
        <button type="submit" id="signup-submit" disabled>가입하기</button>
    </form>
</main>
</body>
</html>
