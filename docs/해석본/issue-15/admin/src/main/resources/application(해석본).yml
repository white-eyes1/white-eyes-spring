# [해석본] 원본: admin/src/main/resources/application.yml (feature/15-cam-status-report 브랜치)
# [무엇] 관리자 앱의 기본 설정. #15에서 바꾼 것은 맨 아래 analyzer·internal-api 두 묶음뿐이고, 그 위는 원래 있던 설정이다.
# [주의] #16 브랜치(dev 기준)의 이 파일에는 아래 두 묶음이 없다. #16은 분석 서버를 부르지 않기 때문이다.
spring:
  application:
    name: white-eyes-admin
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      table-name: SPRING_SESSION_ADMIN
      cleanup-cron: 0 * * * * *
  flyway:
    enabled: true

server:
  port: 8081
  servlet:
    context-path: /admin

management:
  endpoints:
    web:
      exposure:
        include: health

# [해석] #15 추가. AnalyzerClient가 부를 분석 서버 주소. ${...}는 환경변수에서 값을 가져온다는 뜻.
#   코드에 주소를 박지 않는 이유: local·dev·prod마다 분석 서버 위치가 다르고, 설정은 프로필·환경변수로 나눈다(CLAUDE.md).
#   변수 이름 ANALYZER_BASE_URL은 conventions.md '설정값'에 이미 정해진 이름을 그대로 썼다.
analyzer:
  base-url: ${ANALYZER_BASE_URL}

# [해석] #15 추가. 분석 서버에 보낼 X-Internal-Token 값. 비밀값이라 반드시 환경변수로만 받는다(CLAUDE.md "키·비밀번호는 환경변수로만").
#   이름 INTERNAL_API_TOKEN도 conventions.md에 정해진 이름. 나중에 /internal/** 토큰 검사(401)를 만들 때도 같은 값을 쓴다.
internal-api:
  token: ${INTERNAL_API_TOKEN}
