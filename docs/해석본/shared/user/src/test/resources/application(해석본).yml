# [해석본] 원본: user/src/test/resources/application.yml (#15·#16 두 브랜치에서 같은 내용)
# [무엇] 사용자 앱(user) 테스트 설정. #15·#16은 admin 기능인데 왜 user 설정까지 바꿨는가?
#   Camera 엔티티를 common 모듈에 뒀기 때문이다. 사용자 앱도 common의 엔티티를 스캔하므로(UserApplication의 @EntityScan),
#   camera 테이블이 없으면 UserApplicationTests도 validate에서 실패한다. 그래서 admin과 똑같이 테스트에서만 create-drop.
spring:
  datasource:
    url: jdbc:h2:mem:user;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      # TODO(#11): camera 마이그레이션이 생기면 지우고 validate로 되돌린다
      ddl-auto: create-drop
